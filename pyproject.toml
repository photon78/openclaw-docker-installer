[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-docker-installer"
version = "0.0.1"
description = "OpenClaw in a Box – cross-platform setup wizard"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "docker",
    "jinja2",
    "rich",
    "questionary",
    "psutil",
    "httpx",
    "platformdirs",
    "send2trash",
    "typer[all]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[project.scripts]
openclaw-installer = "main:app"

[tool.mypy]
exclude = ["src/installer/templates/"]
ignore_missing_imports = true

[tool.ruff]
exclude = ["src/installer/templates/"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PL",  # pylint
]
ignore = [
    "E501", # line length handled by formatter
    "PLR2004", # magic values in tests are fine
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["wizard", "generator", "installer", "checks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
